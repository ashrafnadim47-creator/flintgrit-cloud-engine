name: Channel 1 - Shadow Will Daily 3D Merged Animation

on:
  schedule:
    # Daily 08:30 AM IST (03:00 UTC) - Viral 9:16 Merged 3D+2D Story Short
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      format:
        description: 'Format to produce (short or long)'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long

jobs:
  produce_shadow_will:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-freefont-ttf fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts numpy pillow scipy requests google-api-python-client google-auth-oauthlib playwright
          python -m playwright install chromium --with-deps || python -m playwright install chromium

      - name: Run Shadow Will Unified Dual Engine (Subah Short / Shaam Long)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          USER_FORMAT="${{ github.event.inputs.format }}"

          if [ "$USER_FORMAT" = "long" ] || { [ "$USER_FORMAT" = "auto" ] && [ "$CURRENT_HOUR" -ge "8" ]; }; then
            echo "=== [SHAAM CYCLE] PRODUCING SHADOW WILL MERGED 3D+2D LONG-FORM FILM ==="
            python3 shadow_will_merged/shadow_will_merged_producer.py --format long
          else
            echo "=== [SUBAH CYCLE] PRODUCING SHADOW WILL MERGED 3D+2D SHORT ==="
            python3 shadow_will_merged/shadow_will_merged_producer.py --format short
          fi

      - name: Persist Shadow Will Topic History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_shadow_will.json || true
          git commit -m "Auto-persist Shadow Will story history [skip ci]" || echo "No history changes"
          git pull --rebase origin main || true
          git push origin main || echo "Push skipped"

      - name: Archive Shadow Will Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-will-output
          path: |
            *.mp4
            history_shadow_will.json
          retention-days: 7
