name: 1-Click Cloud Documentary Film Producer

on:
  # schedule:
  #   - cron: '26 3 * * *'
  workflow_dispatch:
    inputs:
      film_topic:
        description: 'Documentary Blueprint / Topic to Render (or "auto" for daily rotation)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - wright-flyer
          - titanic-last-hours
          - apollo-11-crisis
          - demon-core-accident
          - mary-celeste-mystery
      video_resolution:
        description: 'Output Resolution'
        required: true
        default: '1920x1080'
        type: choice
        options:
          - 1920x1080
          - 1280x720
      auto_upload_to_channel:
        description: 'Automatically Upload to Documentary Channel (Chronicle Vault)?'
        required: true
        default: true
        type: boolean

jobs:
  build_documentary_cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg, Cairo, Pango & Libass)
        run: |
          sudo apt-get update -y || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg libass-dev fontconfig fonts-freefont-ttf fonts-dejavu-core libcairo2-dev libpango1.0-dev libegl1 libgl1 libglib2.0-0 || true

      - name: Install Python Rendering Dependencies
        run: |
          pip install --upgrade pip
          pip install pycairo skia-python pillow numpy scipy edge-tts pysubs2 requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Resolve Topic of the Day
        id: topic_step
        run: |
          USER_TOPIC="${{ github.event.inputs.film_topic }}"
          SELECTED_TOPIC=$(python cinematic_engine/pick_topic.py "$USER_TOPIC" | tail -n 1 | tr -d '\r\n')
          echo "selected_topic=$SELECTED_TOPIC" >> $GITHUB_OUTPUT
          echo "Selected Documentary Topic: $SELECTED_TOPIC"

      - name: Produce 1080p Documentary Film
        run: |
          echo "=== RUNNING 1-CLICK CLOUD DOCUMENTARY PRODUCER ==="
          python cinematic_engine/produce_film_cloud.py "cinematic_engine/assets/${{ steps.topic_step.outputs.selected_topic }}"

      - name: Automatically Upload to Documentary Channel (Channel 3)
        if: github.event_name == 'schedule' || github.event.inputs.auto_upload_to_channel == true || github.event.inputs.auto_upload_to_channel == 'true'
        env:
          YT_CLIENT_ID_DOC: ${{ secrets.YT_CLIENT_ID_DOC }}
          YT_CLIENT_SECRET_DOC: ${{ secrets.YT_CLIENT_SECRET_DOC }}
          YT_REFRESH_TOKEN_DOC: ${{ secrets.YT_REFRESH_TOKEN_DOC }}
        run: |
          echo "=== UPLOADING FINISHED DOCUMENTARY & THUMBNAIL TO CHANNEL 3 (CHRONICLE VAULT) ==="
          python cinematic_engine/upload_documentary_cloud.py "cinematic_engine/assets/${{ steps.topic_step.outputs.selected_topic }}"

      - name: Persist Topic History
        if: always()
        run: |
          git config --global user.name "ChronicleVaultBot"
          git config --global user.email "bot@chroniclevault.ai"
          git add cinematic_engine/history_documentaries.json
          git commit -m "Auto-record documentary history: ${{ steps.topic_step.outputs.selected_topic }}" || echo "No history changes"
          git push origin main || echo "Push skipped"

      - name: Upload Finished 1080p Documentary Video to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cloud-Rendered-Documentary-${{ steps.topic_step.outputs.selected_topic }}
          path: |
            *.mp4
            cinematic_engine/*.mp4
            cinematic_engine/assets/*/*.mp4
            cinematic_engine/assets/*/*.jpg
          retention-days: 14
